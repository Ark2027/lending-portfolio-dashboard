name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python tests/test_dataset.py

      - name: Regenerating the dataset must not change it
        run: |
          python tools/generate_demo_data.py
          git diff --exit-code -- src/data \
            || (echo "::error::src/data is out of date; run tools/generate_demo_data.py and commit" && exit 1)
